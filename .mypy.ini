# --- Mypy configuration ------------------------------------------------------
#
# Effectively strict mode, written out explicitly so that each switch can be
# relaxed on its own rather than as a package.
#
# Caution: this is an ini file parsed by configparser. Inline comments are not
# supported — "key = True  # note" makes the value the literal string
# "True  # note" and mypy fails. Comments must occupy a whole line.
#
# Related files:
#   - .ruff.toml               linting and formatting, kept separate on purpose
#
# Recipes: `just lint`, `just check`.

[mypy]
python_version = 3.12


# --- File selection ----------------------------------------------------------
# Verbose regex, one alternative per line. Directories here are not type
# checked at all.

exclude = (?x)(
    ^build/
    | ^dist/
    | ^venv/
    | ^\.venv/
  )


# --- Imports -----------------------------------------------------------------
# Missing stubs are an error, not a shrug: a dependency without types must be
# handled deliberately, either by a stub package in the `types` group or by a
# narrow per-module override at the bottom of this file.

follow_imports = normal
ignore_missing_imports = False
implicit_reexport = False


# --- Required annotations ----------------------------------------------------
# Untyped code is rejected. Tests relax this below.

disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
check_untyped_defs = True


# --- Type semantics ----------------------------------------------------------
# Optional is never implicit, comparisons between unrelated types are errors,
# and a name cannot silently change its type.

no_implicit_optional = True
strict_optional = True
strict_equality = True
extra_checks = True
allow_redefinition = False
local_partial_types = True


# --- Warnings ----------------------------------------------------------------
# warn_unused_configs reports per-module sections that never matched, which is
# how a stale [mypy-<dir>.*] section gets noticed.

warn_unused_configs = True
warn_return_any = True
warn_unreachable = True
warn_no_return = True


# --- Additional error codes --------------------------------------------------
# Checks that are off by default. explicit-override and mutable-override are
# the valuable ones for a layered codebase: they keep subclasses honest.

enable_error_code =
    redundant-self,
    redundant-cast,
    redundant-expr,
    truthy-bool,
    truthy-iterable,
    unused-awaitable,
    possibly-undefined,
    ignore-without-code,
    unused-ignore,
    explicit-override,
    mutable-override,
    unimported-reveal,
    deprecated


# --- Output ------------------------------------------------------------------

show_error_codes = True
pretty = True
color_output = True


# --- Per-module overrides ----------------------------------------------------
# A section only matches if the directory contains an __init__.py and the
# directory is passed to mypy — see the mypy invocation in the justfile.
# Without both, files resolve as top-level modules and the section is dead.
#
# Each relaxation here is mirrored by ANN rules in .ruff.toml; otherwise ruff
# would demand annotations before mypy ever gets a say.

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True
allow_untyped_decorators = True
warn_return_any = False
