# --- Test stack --------------------------------------------------------------
#
# Runs the test suite inside the image, against the built wheel rather than
# against src/, next to disposable counterparts of the infrastructure. This is
# what the `docker` job in CI executes, so a failure here is a failure there.
#
# A project of its own on purpose: it never touches the containers or volumes
# of the application stack, its data lives in tmpfs and disappears with the
# container, and its credentials are written in the open. For the same reason
# it reads nothing from .config/ or .secrets/ and runs without `just init`.
#
# Related files:
#   - docker/Dockerfile        the `tests` stage this builds
#   - .pytest.toml             the configuration copied into that stage
#
# Recipes: `just test-container`.

name: kop-labworks-tests


x-healthcheck-fast: &healthcheck-fast
  interval: 2s
  timeout: 3s
  retries: 30


services:
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tests

    # The image already contains tests/, so this mount is only a convenience:
    # it overlays fresh test files without a rebuild. Read-only, because a test
    # run must never modify the source.
    volumes:
      - ../tests:/app/tests:ro

    # The suite waits for its dependencies instead of racing them.
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- Disposable dependencies -----------------------------------------------
  # The same images as docker-compose.yml, with two differences: data lives in
  # tmpfs rather than a volume, and health checks poll far more often so a run
  # is not spent waiting.

  postgresql:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_USER: kop
      POSTGRES_DB: kop_tests
      POSTGRES_PASSWORD: tests-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD-SHELL", "pg_isready -U kop -d kop_tests"]

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    tmpfs:
      - /data
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:eb6736723c5d0831ab12d29e7a2b8ee1082f744370c2a784b50b84b3b4d6d030
    environment:
      RABBITMQ_DEFAULT_USER: kop
      RABBITMQ_DEFAULT_PASS: tests-only
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck-fast
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
