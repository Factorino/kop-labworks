# --- Application stack -------------------------------------------------------
#
# One stack for the environments of the application's Environment setting
# (`just up [local|development]`):
#
#   local        this file merged with docker-compose.local.yml: the
#                infrastructure only, published on 127.0.0.1 for application
#                processes run on the host.
#   development  everything in containers: the infrastructure plus the
#                application processes, which carry `profiles: [app]` as they
#                are added. Nothing but the API is published on the host.
#
# Both are the same compose project, so they share containers and data:
# switching from one to the other recreates what changed and keeps the volumes.
# `testing` runs a separate, disposable stack; `staging` and `production` get
# an override of their own once there is an application image to deploy.
#
# Requires `just init` first: the secrets it reads and the variables it
# interpolates are generated from the templates under .secrets/ and .config/,
# and none of them is tracked in git.
#
# Related files:
#   - docker/docker-compose.local.yml    ports for the local environment
#   - docker/docker-compose.testing.yml  the disposable test stack
#   - .config/compose.env.example        the variables interpolated below
#
# Recipes: `just up`, `just down`, `just stop`, `just restart`, `just ps`,
# `just logs`, `just teardown`.

name: kop-labworks


# --- Shared fragments --------------------------------------------------------
# YAML anchors merged into services below, so a change lands everywhere at
# once. They are not services and Compose ignores the x- prefix.

# Bounded log growth: without this, json-file logs fill the disk eventually.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

# Applies to every service: a process inside a container may never gain more
# privileges than it started with, even through a setuid binary.
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true

# What every process started from the application image shares: the image, the
# profile, the hardening, the mounted configuration and the secrets. A service
# adds only what makes it that process — its command, ports and health check.
x-app-defaults: &app-defaults
  image: kop-labworks:local
  # Built by the `api` service (see its `build`), never pulled.
  pull_policy: never
  profiles: [app]
  init: true  # Reaps zombies; the application need not be PID 1 aware.
  <<: *security-defaults

  # The filesystem is read-only apart from /tmp. Code that needs to write gets
  # its own volume or tmpfs — do not relax read_only for it.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL

  # The whole configuration, read-only: the container may not rewrite what it
  # was configured with. The path is the one CONFIG_FILE names.
  volumes:
    - ../.config/development.toml:/etc/kop/config.toml:ro
  environment:
    CONFIG_FILE: /etc/kop/config.toml

  # Mounted as files under /run/secrets, never as environment variables: a
  # variable is visible in `docker inspect` and in the process list. Each
  # target is the path a `*_file` key in .config/development.toml points at.
  secrets:
    - source: postgres-password
      target: postgres_password

  networks:
    - backend
  logging: *default-logging


services:
  # --- Application -----------------------------------------------------------
  # Profile `app`: started in the development environment only. In `local` the
  # same processes run on the host instead (`just run`).

  # Applies the migrations and exits. A service of its own rather than a step
  # in the API's startup: with several API replicas each would race to migrate
  # the same schema.
  migrate:
    <<: *app-defaults
    command: ["kop-cli", "db", "upgrade"]
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy

  api:
    <<: *app-defaults
    # The one service that builds the image; the others reuse the tag.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["kop-api"]
    restart: unless-stopped
    stop_grace_period: 15s  # Time allowed for a clean shutdown on SIGTERM.

    # The schema has to exist before the first request, so the API waits for
    # the one-shot migration to finish rather than merely to start.
    depends_on:
      postgresql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # Loopback only: this stack is for development. The container side must
    # agree with `server.port` in .config/development.toml.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - backend
      - frontend

    # Liveness, matching what /health answers. The standard library rather
    # than curl, which the slim image does not carry.
    healthcheck:
      <<: *healthcheck-defaults
      interval: 10s
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health", timeout=2).status == 200 else 1)
    logging: *default-logging

  # --- Infrastructure --------------------------------------------------------
  #
  # Note the two secret styles: PostgreSQL reads its password from a file under
  # /run/secrets, RabbitMQ from an environment variable — it supports nothing
  # else. Prefer the file form wherever a service offers it.

  postgresql:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    restart: unless-stopped
    <<: *security-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres-password
        target: postgres_password
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      interval: 5s
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    logging: *default-logging

  # Sessions live here. AOF, so a restart does not sign everyone out.
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    <<: *security-defaults
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      interval: 5s
      test: ["CMD", "redis-cli", "ping"]
    logging: *default-logging

  # Delivery tasks for the channel workers.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:eb6736723c5d0831ab12d29e7a2b8ee1082f744370c2a784b50b84b3b4d6d030
    restart: unless-stopped
    <<: *security-defaults
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      interval: 10s
      start_period: 30s
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
    logging: *default-logging


# --- Networks ----------------------------------------------------------------
# Two networks rather than one: the infrastructure attaches to the internal
# one, which has no route out and cannot publish ports. Whatever must be
# reachable from outside also joins `frontend`.

networks:
  frontend:
  backend:
    internal: true


# --- Volumes -----------------------------------------------------------------
# Named volumes survive `just down`; `just teardown` removes them.

volumes:
  postgresql-data:
  redis-data:
  rabbitmq-data:


# --- Secrets -----------------------------------------------------------------
# The source files are created by `just init` from .secrets/*.example. None of
# them is tracked in git, and compose refuses to start a stack whose secret
# file is missing.

secrets:
  postgres-password:
    file: ../.secrets/pg_pwd.txt
